name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 24

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blood_donor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blood_donor_test?schema=public

      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blood_donor_test?schema=public
          SKIP_OTP_VERIFICATION: "true"
          JWT_SIGNING_KEY: test-key-not-for-production

      - run: npm run build
        if: github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/blood_donor_test?schema=public
          SKIP_OTP_VERIFICATION: "true"
          JWT_SIGNING_KEY: test-key-not-for-production
